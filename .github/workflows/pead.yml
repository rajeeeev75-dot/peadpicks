name: Update PEAD data
on:
  schedule:
    - cron: "30 13 * * 1-6"   # 19:00 IST, Mon-Sat, after most results are filed
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python fetch_results.py
      - run: |
          git config user.name "pead-bot"; git config user.email "bot@users.noreply.github.com"
          git add pead.csv; git diff --staged --quiet || (git commit -m "Update PEAD data" && git push)
