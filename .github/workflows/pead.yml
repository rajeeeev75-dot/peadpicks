name: Update PEAD data
on:
  schedule:
    - cron: "*/30 3-16 * * 1-6"   # every 30 min, 08:30-22:00 IST, Mon-Sat: quick refresh of fresh filers
    - cron: "30 13 * * *"         # 19:00 IST daily: full scan of every NSE stock (resumes where the last run stopped)
    - cron: "30 20 * * *"         # 02:00 IST daily: second full-scan pass, so the whole universe is covered quickly
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pead-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      FAST: ${{ github.event.schedule == '*/30 3-16 * * 1-6' && '1' || '0' }}
      BUDGET_MIN: ${{ github.event.schedule == '*/30 3-16 * * 1-6' && '20' || '110' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python fetch_results.py
      - run: |
          git config user.name "pead-bot"; git config user.email "bot@users.noreply.github.com"
          git add pead.csv scan_state.json universe.txt
          git diff --staged --quiet && exit 0
          git commit -m "Update PEAD data"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push after 5 tries"; exit 1
