name: Update PEAD data
on:
  schedule:
    - cron: "*/30 3-16 * * 1-6"   # every 30 min, 08:30-22:00 IST, Mon-Sat: quick refresh of fresh filers
    - cron: "30 13 * * 1-6"       # 19:00 IST, Mon-Sat: full refresh of every stock
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pead-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FAST: ${{ github.event.schedule == '*/30 3-16 * * 1-6' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python fetch_results.py
      - run: |
          git config user.name "pead-bot"; git config user.email "bot@users.noreply.github.com"
          git add pead.csv
          git diff --staged --quiet || (git commit -m "Update PEAD data" && git pull --rebase && git push)
